[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-discord"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bot = ["routing.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]