[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-discord-refactor-draft"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.40",
  "discord.py>=2.6",
  "openai>=1.100",
  "pypdf>=5",
  "pypdfium2>=4",
  "python-dotenv>=1.1",
  "ddgs>=9",
  "tavily-python>=0.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
